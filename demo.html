</style></head><body><main><header><b>映屏 / SAMPLE</b><span>虚构布局示例</span></header><div class="layout"><section class="intro"><small>A LITTLE SPACE TO EXPLORE</small><h1>让灵感，<br>在每一屏舒展。</h1><p>切换手机、折叠内屏与横屏，看看页面如何重新排列。</p></section><div class="art" aria-hidden="true"></div></div><div class="grid"><article><small>01 / VIEW</small><b>同一个页面</b><p>网页内容不变，换一个宽高，布局自然调整。</p></article><article><small>02 / EXPLORE</small><b>不同的视角</b><p>小屏单列，大屏并排。让每一种阅读都舒服。</p></article><article><small>03 / SHARE</small><b>一起看适配</b><p>分享链接，把你的网页和屏幕设置一起带过去。</p></article></div><footer>内置静态示例 · 不含账号或会议数据</footer></main></body></html>
